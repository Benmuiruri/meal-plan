<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5B9E">
<meta name="color-scheme" content="light">
<title>Meal &amp; Shop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   1. DESIGN TOKENS — hand-painted hoteli menu board
   ================================================================ */
:root {
  --blue:    #1B5B9E;
  --mustard: #F2B21B;
  --tomato:  #E23E2C;
  --leaf:    #2E7D46;
  --chalk:   #FBF6EA;
  --ink:     #17140F;

  --chalk-dim: rgba(251, 246, 234, 0.62);
  --ink-dim:   rgba(23, 20, 15, 0.55);
  --line:      rgba(23, 20, 15, 0.14);

  --display: 'Anton', sans-serif;
  --body:    'Work Sans', sans-serif;
  --mono:    'DM Mono', monospace;

  --radius: 12px;
  --field-gap: 12px; /* one row rhythm: .field and the wrapper that stands in for it */
  --tabbar-h: calc(58px + env(safe-area-inset-bottom));
}

/* ================================================================
   2. BASE
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body);
  background: var(--chalk);
  color: var(--ink);
  min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* the one focus treatment — text fields match :focus-visible on any focus
   (browser heuristic), buttons only from keyboard. Nothing may suppress it. */
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

.money { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.screen {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--tabbar-h) + 96px);
}

h2.screen-title {
  font-family: var(--display);
  font-size: 26px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 6px 0 14px;
}

/* ================================================================
   3. HEADER, STATUS DOT, BANNERS, TAB BAR
   ================================================================ */
.header {
  position: sticky; top: 0; z-index: 30;
  background: var(--blue); color: var(--chalk);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px calc(10px);
  padding-top: calc(12px + env(safe-area-inset-top));
  box-shadow: 0 2px 0 rgba(23,20,15,0.25);
}
.header .brand {
  font-family: var(--display);
  font-size: 20px; letter-spacing: 0.06em;
}
.brand .amp { color: var(--mustard); }
.save-state { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--chalk-dim); }
.save-state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
.save-state[data-status="saving"] .dot { background: var(--mustard); }
.save-state[data-status="error"]  .dot { background: var(--tomato); }

.banner {
  background: var(--tomato); color: var(--chalk);
  padding: 10px 16px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
.banner button {
  background: var(--chalk); color: var(--tomato);
  font-weight: 700; font-size: 13px;
  padding: 6px 12px; border-radius: 8px; flex-shrink: 0;
}

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--chalk);
  border-top: 2px solid var(--ink);
  display: flex;
  /* min-, not fixed: the two-line label case sits within a hair of 58px, so
     any font/icon drift must grow the bar rather than clip into the inset */
  min-height: var(--tabbar-h);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  /* top-anchored, not centered: a two-line label ("Choose meals" on a phone)
     must grow downward without lifting its icon off the shared row */
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding-top: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-dim);
}
/* two lines at 1.1 keep the tallest tab ~2px inside the 58px box, so the
   bar never actually outgrows the token the totals bar and hint sit on */
.tabbar a span { text-align: center; line-height: 1.1; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.is-active { color: var(--tomato); }
.tabbar a:focus-visible { outline-offset: -4px; border-radius: 8px; }

/* ================================================================
   4. STANDALONE CARDS (sign in, config, errors)
   ================================================================ */
.gate {
  min-height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
  background: var(--blue);
}
.gate .board-title {
  font-family: var(--display); color: var(--chalk);
  font-size: 44px; letter-spacing: 0.04em; text-transform: uppercase;
  text-align: center; line-height: 1.05;
}
.gate .board-title .amp { color: var(--mustard); }
.gate .tagline { color: var(--chalk-dim); margin: 10px 0 28px; font-size: 15px; text-align: center; }
.gate-card {
  background: var(--chalk); border-radius: var(--radius);
  padding: 22px; width: 100%; max-width: 400px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.25);
}
.gate-card h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
.gate-card p { font-size: 14px; line-height: 1.5; color: var(--ink-dim); margin-bottom: 12px; }
.gate-card ol { font-size: 14px; line-height: 1.6; padding-left: 20px; }
.gate-card ol li { margin-bottom: 8px; }
.gate-card code { font-family: var(--mono); font-size: 13px; background: rgba(23,20,15,0.07); padding: 1px 5px; border-radius: 4px; }
.gate-card .error { color: var(--tomato); font-weight: 600; font-size: 13px; margin-top: 10px; }

.field {
  width: 100%; padding: 12px 14px; margin-bottom: var(--field-gap);
  border: 2px solid var(--ink); border-radius: 10px;
  background: #fff; font-size: 16px;
}
.field-password { position: relative; margin-bottom: var(--field-gap); }
/* the field keeps its own box; the button is laid over its right end, and the
   padding is what stops a long password running under the icon */
.field-password .field { margin-bottom: 0; padding-right: 52px; }
.pw-toggle {
  position: absolute; top: 0; right: 0; height: 100%; width: 50px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-dim);
}
.pw-toggle svg { width: 22px; height: 22px; }
.pw-toggle[aria-pressed="true"] { color: var(--ink); }
.pw-toggle[aria-pressed="false"] .icon-eye-off,
.pw-toggle[aria-pressed="true"] .icon-eye { display: none; }

.field-file { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.field-file > span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
.btn-primary {
  width: 100%; padding: 13px;
  background: var(--tomato); color: var(--chalk);
  font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
  border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.3);
}
.btn-primary:active { transform: translateY(2px); box-shadow: none; }
.btn-primary:disabled { opacity: 0.55; }

/* ================================================================
   5. PICK
   ================================================================ */
.pick-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
.pick-toggle button {
  flex: 1; padding: 10px;
  font-family: var(--display); font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase;
  border: 2px solid var(--ink); border-radius: 10px; color: var(--ink-dim);
}
.pick-toggle button.is-active { background: var(--ink); color: var(--chalk); }

.pick-count {
  position: sticky; top: 55px; z-index: 20;
  background: var(--chalk);
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 2px; border-bottom: 2px solid var(--ink);
  margin-bottom: 14px;
}
.pick-count .label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
.pick-count .count { font-family: var(--mono); font-size: 20px; font-weight: 500; }
/* the count sets the row height. Centring the button and holding it to one
   line keep its box within the count's, so the grid does not shift on pick 1 */
.pick-tally { display: flex; align-items: center; gap: 12px; }
.pick-clear {
  position: relative;
  border: 2px solid var(--ink); border-radius: 8px; padding: 3px 10px;
  font-size: 13px; font-weight: 700; line-height: 1; flex-shrink: 0;
}
/* the row caps the button at 23px, a miss under a thumb. inset resolves against
   the padding box, so -13px (not -11) stretches the tap area to the row's 45px */
.pick-clear::after { content: ''; position: absolute; inset: -13px -8px; }

.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meal-card {
  position: relative; aspect-ratio: 1;
  border-radius: var(--radius); overflow: hidden;
  border: 3px solid transparent;
  box-shadow: 0 2px 0 rgba(23,20,15,0.2);
  text-align: left; width: 100%;
  display: flex; align-items: flex-end;
  padding: 10px;
  /* a long-press must reach our timer, not iOS's image callout or selection */
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.meal-card .name {
  font-family: var(--display); color: var(--chalk);
  font-size: 17px; line-height: 1.15; letter-spacing: 0.03em; text-transform: uppercase;
  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  position: relative; z-index: 1;
}
.meal-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.meal-card .shade { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,0.55)); }
.meal-card.is-picked { border-color: var(--ink); }
.meal-card .badge {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--mustard); color: var(--ink);
  display: none; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.3);
}
.meal-card.is-picked .badge { display: flex; }

.add-card {
  aspect-ratio: 1; border-radius: var(--radius);
  border: 3px dashed var(--ink-dim); color: var(--ink-dim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 14px; width: 100%;
}
.add-card .plus { font-size: 34px; line-height: 1; font-family: var(--display); }
.pick-hint { color: var(--ink-dim); font-size: 12px; text-align: center; margin-top: 14px; }

.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(23,20,15,0.5); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  background: var(--chalk); border-radius: 16px 16px 0 0;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto;
}
.sheet h3 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 14px; }
.sheet .row-btns { display: flex; gap: 10px; margin-top: 4px; }
.sheet .row-btns .btn-primary { flex: 2; width: auto; }
.btn-quiet {
  flex: 1; padding: 13px; border-radius: 10px;
  border: 2px solid var(--ink); font-weight: 700; font-size: 15px;
}
.btn-archive, .btn-restore {
  width: 100%; margin-top: 10px; padding: 11px; border-radius: 10px;
  border: 2px solid var(--tomato); color: var(--tomato);
  font-weight: 700; font-size: 14px;
}
.btn-restore { border-color: var(--leaf); color: var(--leaf); }
.btn-archive:disabled, .btn-restore:disabled { opacity: 0.55; }
/* the confirm rides above whichever sheet asked it — z-index, not DOM order,
   decides the stack here, so its backdrop must outrank the sheets' 41 */
.sheet-backdrop.is-top { z-index: 42; }
.sheet.is-top { z-index: 43; }
.confirm-body { font-size: 14px; line-height: 1.45; margin-bottom: 16px; }

/* ================================================================
   6. WEEK — the painted board
   ================================================================ */
.board {
  background: var(--blue); border-radius: 14px;
  padding: 18px 16px 8px;
  box-shadow: 0 5px 0 rgba(23,20,15,0.35);
  color: var(--chalk);
}
.board-head {
  font-family: var(--display); color: var(--mustard);
  text-transform: uppercase; letter-spacing: 0.08em; font-size: 14px;
  text-align: center; padding-bottom: 12px;
  border-bottom: 2px solid rgba(251,246,234,0.35);
}
.board-day { padding: 13px 0 12px; border-bottom: 1px dashed rgba(251,246,234,0.3); }
.board-day:last-child { border-bottom: none; }
.board-day .day-name {
  font-family: var(--display); color: var(--mustard);
  font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.slot {
  display: flex; align-items: baseline; gap: 10px;
  width: 100%; text-align: left; padding: 4px 6px; margin: 0 -6px;
  border-radius: 8px; border: 2px solid transparent;
}
.slot .tag {
  flex-shrink: 0; width: 74px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--chalk-dim);
}
.slot .meal { font-size: 15px; font-weight: 500; }
.slot--dinner .meal { font-size: 17px; font-weight: 700; }
.slot--dinner .tag { color: var(--mustard); }
.slot--lunch { color: var(--chalk-dim); }
.slot--lunch .meal { font-size: 13px; font-style: italic; font-weight: 400; }
.slot--lunch .lunch-input {
  flex: 1; min-width: 0; padding: 0;
  background: transparent; border: none; border-radius: 4px;
  color: var(--chalk); font: inherit; font-size: 13px; font-style: italic;
}
.slot--lunch .lunch-input::placeholder { color: var(--chalk-dim); opacity: 1; }
button.slot:active { background: rgba(251,246,234,0.12); }
.slot.is-lifted {
  border-color: var(--mustard); background: rgba(242,178,27,0.14);
  transform: translateY(-3px);
  transition: transform 0.15s ease;
}
.swap-hint {
  position: sticky; bottom: calc(var(--tabbar-h) + 8px); z-index: 25;
  margin-top: 14px;
  background: var(--mustard); color: var(--ink);
  font-size: 13px; font-weight: 600;
  padding: 10px 14px; border-radius: 10px;
  box-shadow: 0 3px 0 rgba(23,20,15,0.3);
}
.week-locked {
  background: var(--blue); color: var(--chalk); border-radius: 14px;
  padding: 40px 24px; text-align: center;
  box-shadow: 0 5px 0 rgba(23,20,15,0.35);
}
.week-locked .big { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.3; margin-bottom: 12px; }
.week-locked .counts { font-family: var(--mono); color: var(--mustard); font-size: 15px; }

/* ================================================================
   7. BUDGET
   ================================================================ */
.budget-head { margin-bottom: 18px; }
.budget-head label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin-bottom: 6px; }
.budget-amount { display: flex; align-items: center; gap: 8px; }
.budget-amount .cur { font-family: var(--mono); font-size: 20px; color: var(--ink-dim); }
.budget-amount input {
  width: 100%; padding: 10px 12px; font-family: var(--mono); font-size: 24px;
  border: 2px solid var(--ink); border-radius: 10px; background: #fff;
}

.list-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin: 18px 0 8px; }
.g-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px; border-bottom: 1px solid var(--line);
}
.g-row .g-name { flex: 1; font-weight: 500; font-size: 15px; }
.g-row input.g-price {
  width: 84px; text-align: right;
  font-family: var(--mono); font-size: 15px;
  padding: 7px 8px; border: 2px solid var(--line); border-radius: 8px; background: #fff;
}
.g-row input.g-price:focus { border-color: var(--ink); }
.g-row input.g-price:disabled { background: transparent; border-color: transparent; }

/* amounts are typed, never nudged — no spinner arrows on any number input */
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.tick { position: relative; width: 26px; height: 26px; flex-shrink: 0; }
.tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.tick .box {
  position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 7px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: transparent; font-weight: 700; font-size: 15px;
  pointer-events: none;
}
.tick input:checked + .box { background: var(--leaf); border-color: var(--leaf); color: var(--chalk); }
.tick input:focus-visible + .box { outline: 3px solid var(--mustard); }
.tick input:disabled + .box { opacity: 0.45; }

.g-remove { color: var(--tomato); font-size: 20px; font-weight: 700; width: 26px; flex-shrink: 0; text-align: center; }
.g-restore { border: 2px solid var(--ink); border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.g-restore:disabled { opacity: 0.4; }

.add-item { display: flex; gap: 8px; margin-top: 12px; }
.add-item input { padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font-size: 15px; min-width: 0; }
.add-item input[name="name"] { flex: 1; }
.add-item input[name="price"] { width: 92px; font-family: var(--mono); text-align: right; }
.add-item button {
  background: var(--ink); color: var(--chalk); font-weight: 700;
  padding: 0 16px; border-radius: 10px; flex-shrink: 0;
}
.add-item button:disabled { opacity: 0.4; }

.save-week-btn { width: 100%; margin-top: 18px; }

.hist-back { display: inline-block; margin: 2px 0 10px; font-weight: 700; color: var(--blue); }
.delete-week-btn { margin-top: 18px; }
.hist-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 4px; border-bottom: 1px solid var(--line);
  color: var(--ink); font-weight: 500;
}
.hist-row .money { color: var(--ink-dim); }
.tick-static { width: 26px; flex-shrink: 0; text-align: center; color: var(--leaf); font-weight: 700; }

.totals {
  position: fixed; left: 0; right: 0; bottom: var(--tabbar-h); z-index: 29;
  background: var(--ink); color: var(--chalk);
  padding: 12px 16px;
}
.totals-inner { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.totals .t-block { text-align: right; }
.totals .t-block:first-child { text-align: left; }
.totals .t-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(251,246,234,0.55); }
.totals .t-num { font-family: var(--mono); font-size: 18px; }
.totals .t-num.t-big { font-size: 28px; font-weight: 500; line-height: 1.1; }
.totals[data-tone="green"] .t-big { color: #7fd89a; }
.totals[data-tone="amber"] .t-big { color: var(--mustard); }
.totals[data-tone="red"]   .t-big { color: #ff8d7e; }

/* ================================================================
   8. SUMMARY
   ================================================================ */
.sum-board { margin-bottom: 20px; }
.sum-day { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(251,246,234,0.3); font-size: 13px; }
.sum-day:last-child { border-bottom: none; }
.sum-day .d { font-family: var(--display); color: var(--mustard); width: 46px; flex-shrink: 0; letter-spacing: 0.08em; font-size: 13px; padding-top: 1px; }
.sum-day .meals-col { flex: 1; min-width: 0; }
.sum-day .m-line { display: flex; gap: 6px; }
.sum-day .m-line .k { color: var(--chalk-dim); width: 14px; flex-shrink: 0; font-weight: 700; }
.sum-day .m-line.lunch { color: var(--chalk-dim); font-style: italic; }

.shop-row { padding: 4px; }
.g-num { width: 26px; flex-shrink: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.shop-row.is-checked .g-name { text-decoration: line-through; opacity: 0.45; }
.shop-row.is-checked .money { opacity: 0.45; }
.empty-note { color: var(--ink-dim); font-size: 14px; padding: 16px 4px; line-height: 1.5; }

/* ================================================================
   9. MOTION
   ================================================================ */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Meal &amp; Shop needs JavaScript turned on.</p></noscript>

<script type="module">
/* ================================================================
   1. CONFIG — paste your two values from Supabase → Settings → API
   ================================================================ */
const CONFIG = {

// forever, or a reload is the only way out. Abandoning is not cancelling —
// timedOut marks an outcome only a resync can settle.
const MEAL_REQUEST_CEILING_MS = 15000;
function withCeiling(promise, ms = MEAL_REQUEST_CEILING_MS) {
  let timer;
  const ceiling = new Promise((_, reject) => {
    timer = setTimeout(() => {
      const slow = new Error('it took too long to answer');
      slow.timedOut = true;
      reject(slow);
    }, ms);
  });
  return Promise.race([promise, ceiling]).finally(() => clearTimeout(timer));
}

// Downscale to a 0.12MP pixel budget (400×300-ish) before upload: bounds file
// size AND resolution where an edge bound lets extreme aspect ratios cheat.
const IMAGE_PIXEL_BUDGET = 400 * 300;
async function resizeImage(file) {
  if (file.size > 20 * 1024 * 1024) {
    throw new Error('that image is too large — 20MB max');
  }
  const bmp = await createImageBitmap(file).catch(() => {
    throw new Error("couldn't read that image — try a JPEG or PNG");
  });
  // dimensions are unknowable before the decode, which has already allocated
  // the bitmap — this bounds only the canvas below; the 20MB file check above
  // is the sole pre-decode bound
  if (bmp.width * bmp.height > 50e6) {
    bmp.close();
    throw new Error('that image has too many pixels — 50 megapixels max');
  }
  const scale = Math.min(1, Math.sqrt(IMAGE_PIXEL_BUDGET / (bmp.width * bmp.height)));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  bmp.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
  if (!blob) throw new Error("couldn't process that image");
  return blob;
}

function picksComplete(week) {
  return week.picks.mains.length === PICK_TARGET
      && week.picks.breakfasts.length === PICK_TARGET;
}

// Drop unpicked meals, dedupe, backfill from picks in order. Lunch overrides
// are the user's own words, not picks — they ride along untouched.
function reconcileDays(picks, days) {
  const out = {};
  for (const k of DAY_KEYS) {
    out[k] = { breakfast: days?.[k]?.breakfast ?? null, dinner: days?.[k]?.dinner ?? null };
    if (days?.[k]?.lunch) out[k].lunch = days[k].lunch;
  }
  const slots = [['breakfast', picks.breakfasts], ['dinner', picks.mains]];
  for (const [slot, list] of slots) {
    const valid = new Set(list);
    const used = new Set();
    for (const k of DAY_KEYS) {
      const id = out[k][slot];
      if (id && (!valid.has(id) || used.has(id))) out[k][slot] = null;
      if (out[k][slot]) used.add(out[k][slot]);
    }
    const queue = list.filter((id) => !used.has(id));
    for (const k of DAY_KEYS) {
      if (!out[k][slot] && queue.length) out[k][slot] = queue.shift();
    }
  }
  return out;
}

function swapSlots(days, slot, dayA, dayB) {
  const out = structuredClone(days);
  [out[dayA][slot], out[dayB][slot]] = [out[dayB][slot], out[dayA][slot]];
  return out;
}

// Lunch defaults to the previous day's dinner (Monday has none) and is only
// stored when the user types their own — { custom } beats { mealId }.
function lunchFor(days, dayKey) {
  const custom = days?.[dayKey]?.lunch;
  if (custom) return { custom };
  const i = DAY_KEYS.indexOf(dayKey);
  const id = i <= 0 ? null : days[DAY_KEYS[i - 1]]?.dinner ?? null;
  return id ? { mealId: id } : null;
}

function computeTotals(week) {
  const total = Math.round(week.groceries.reduce((sum, g) => sum + (g.price ?? 0), 0) * 100) / 100;
  const budget = week.budget;
  const remaining = budget == null ? null : Math.round((budget - total) * 100) / 100;
  return { total, budget, remaining };
}

function budgetTone({ budget, remaining }) {
  if (remaining == null) return 'plain';
  if (remaining < 0) return 'red';
  if (budget > 0 && remaining < budget * 0.1) return 'amber';
  return 'green';
}

// The draft that follows a saved week: the week after it when saved on time,
// the coming Monday when the saved week had gone stale in between.
function nextDraftStart(savedStart, todayMonday) {
  const following = addDays(savedStart, 7);
  return following > todayMonday ? following : todayMonday; // ISO compares lexically
}

  async deleteWeek(weekId) {

    const { data, error } = await this.client.from('weeks')

    if (!week.user_id || !week.week_start || !week.status) {

      const incomplete = new Error('week row incomplete — cannot restore');

  async uploadMealImage(blob) {

// Supabase node clock skew can reject a fresh token as "issued at future";
// the message is the discriminator (PGRST303 alone also covers expired).
// Re-running the whole method is safe only while every db method stays
// idempotent — new methods must keep that property or opt out of the wrap.
const SKEW_RETRY_MS = 2000;
async function withSkewRetry(run) {
  try {
    return await run();
  } catch (err) {
    const skewRejected = err?.code === 'PGRST303' && /issued at future/i.test(err?.message ?? '');
    if (!skewRejected) throw err;
    await new Promise((resolve) => setTimeout(resolve, SKEW_RETRY_MS));
    return run();
  }
}
for (const [name, method] of Object.entries(db)) {
  if (typeof method !== 'function') continue;
  db[name] = function (...args) { return withSkewRetry(() => method.apply(this, args)); };
}

// The native confirm dialog's replacement. Resolves true only from the
// Confirm button; Cancel, the backdrop, Escape, a back gesture and the
// unknown-write lock all settle false — an unanswered question would
// strand the flow awaiting it.
function confirmSheet({ title, body, confirmLabel }) {
  return new Promise((resolve) => {
    settleConfirm(false); // one question at a time: a clobbered ask must resolve, not dangle
    state.confirm = { title, body, confirmLabel, resolve };
    render();
    $('.sheet [data-action="confirm-no"]')?.focus(); // land on the safe answer
  });
}

function settleConfirm(answer) {
  const open = state.confirm;
  if (!open) return; // already answered — a late teardown must not re-resolve
  state.confirm = null; // cleared before resolve, so the resuming flow renders no stale sheet
  open.resolve(answer);
  render();
}

// The confirm's one-button sibling: nothing to decide, so Okay, the backdrop,
// Escape and back all just dismiss it — the answer is never read.
function noticeSheet({ title, body }) {
  return new Promise((resolve) => {
    settleConfirm(false); // same slot, same rule: one question at a time
    state.confirm = { title, body, confirmLabel: 'Okay', notice: true, resolve };
    render();
    $('.sheet [data-action="confirm-yes"]')?.focus(); // the only answer there is
  });
}

// Starting a tab over. null is neither yes nor no: nothing was cleared, for
// a reason that was not your answer.
async function clearPicks(tab) {
  const week = state.week;
  const count = week.picks[tab].length;
  if (!count) return null;
  const noun = KIND_FOR_TAB[tab];
  if (!(await confirmSheet({
    title: `Clear ${count} picked ${count === 1 ? noun : noun + 's'}?`,
    body: 'The days they filled go back to empty.',
    confirmLabel: 'Clear',
  }))) return false;
  // unreachable while the page stays inert under an open question and every
  // teardown answers it first — the error lock, Escape, a back gesture, a
  // sign-out. Kept because scheduleSave persists state.week, so a swap would
  // save a week this question never named.
  if (state.week !== week) {
    noticeSheet({
      title: 'The week moved on',
      body: 'It reloaded while you were deciding — nothing was cleared.',
    });
    return null;
  }
  week.picks[tab] = [];
  week.days = reconcileDays(week.picks, week.days);
  scheduleSave();
  render();
  return true;
}

/* ================================================================
   7. SAVE PIPELINE — debounced 800ms, loud on failure
   ================================================================ */
let saveTimer = null;
let saveInFlight = false;

function scheduleSave() {
  setSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 800);
}

async function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!state.week) return;
  // Strictly serialized: concurrent saves can land out of order server-side
  // and stamp "Saved" while newer edits are still airborne.
  if (saveInFlight) {
    saveTimer = setTimeout(flushSave, 200);
    return;
  }
  saveInFlight = true;
  try {
    await db.saveWeek(state.week);
    if (!saveTimer) setSaveStatus('saved');
  } catch (err) {
    // no silent failure: keep the edits in memory and surface the banner —
    // transient failures offer Retry, permanent ones an honest Reload
    state.saveErrorPermanent = !!err?.permanent;
    setSaveStatus('error');
  } finally {
    saveInFlight = false;
    // edits queued while hidden: don't trust a throttled background timer —
    // send now, while the page is still alive to complete the request
    if (saveTimer && document.visibilityState === 'hidden') flushSave();
  }
}

// Surgical (a render() would yank focus mid-typing): rebuilt only when the
// failure class changes, so a repeated failure keeps the Retry button intact.
function updateSaveBanner() {
  const existing = $('#save-banner');
  const show = state.phase === 'ready' && state.saveStatus === 'error';
  const kind = state.saveErrorPermanent ? 'permanent' : 'transient';
  if (show && existing?.dataset.kind === kind) return;
  existing?.remove();
  if (show) $('.header')?.insertAdjacentHTML('afterend', viewSaveErrorBanner());
}

function setSaveStatus(status) {
  state.saveStatus = status;
  updateSaveBanner(); // a resumed edit clears "Couldn't save" immediately
  const el = $('#save-state');
  if (el) {
    el.dataset.status = status;
    el.querySelector('.label').textContent =
      status === 'saving' ? 'Saving' : status === 'error' ? 'Not saved' : 'Saved';
  }
}

// Freezing the week as one guarded flow; the caller owns dialogs/navigation.
// Outcomes: busy | dirty (sync not clean) | save-failed (flip provably didn't
// land, retryable) | save-unknown (transport: only a resync knows — lock the
// UI into it) | load-failed (frozen, next draft failed — lock) | done.
let saveWeekInFlight = false;
const saveWeekBusy = () => saveWeekInFlight;
async function performSaveWeek(todayMonday, waitCeilingMs = 15000) {
  if (saveWeekInFlight) return { outcome: 'busy' };
  saveWeekInFlight = true;
  try {
    await flushSave();
    // wait out a re-queued flush rather than misread 'saving' as failure —
    // bounded, so a hung request exits as dirty instead of latching the flow
    const deadline = Date.now() + waitCeilingMs;
    while (state.saveStatus === 'saving' && Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 50));
    }
    if (state.saveStatus === 'saving') {
      // ceiling elapsed, request still in flight: stop the chip reading
      // "Saving" forever; the failure class stays as last actually observed
      setSaveStatus('error');
    }
    if (state.saveStatus !== 'saved') return { outcome: 'dirty' };
    try {
      await db.markWeekSaved(state.week.id);
    } catch (err) {
      // a coded rejection or a provably-vanished row means nothing flipped —
      // retrying is honest advice. Anything else is unknowable.
      return {
        outcome: (err?.weekRowGone || isServerRejection(err)) ? 'save-failed' : 'save-unknown',
        error: err,
      };
    }
    state.week.status = 'saved';
    state.history = null; // the cached list no longer has the newest week
    try {
      state.week = await db.loadActiveWeek(state.session.user.id, todayMonday);
    } catch (err) {
      return { outcome: 'load-failed', error: err };
    }
    state.lifted = null;
    return { outcome: 'done' };
  } finally {
    saveWeekInFlight = false;
  }
}

function viewPick() {

  const cards = state.meals.filter((m) => m.kind === kind && (!m.archived || picked.includes(m.id)));

  return `
    <div class="screen">
      <div class="pick-toggle" role="tablist">

            : '';

  if (state.historyDetail) return viewHistoryDetail();
  let body;

    body = `

      <button type="button" class="btn-primary" data-action="retry-history">Try again</button>`;
  } else if (!state.history) {
    body = '<p class="empty-note">Loading…</p>';
  } else if (state.history.length === 0) {
    body = '<p class="empty-note">No saved weeks yet — when a week is done, save it from the Summary tab.</p>';

    body = state.history.map((w) => {
      const t = computeTotals(w);

          <span class="hist-date">Week of ${fmtDate(w.week_start)}</span>

  const app = $('#app');
  switch (state.phase) {
    case 'loading':     app.innerHTML = viewGate(`<p>${esc(state.loadingMsg || 'Loading…')}</p>`); return;
    case 'config':      app.innerHTML = viewConfig(); return;
    case 'signin':      app.innerHTML = viewSignin(); return;
    case 'error':       app.innerHTML = viewError(); return;
  }
  const screens = { pick: viewPick, week: viewWeek, budget: viewBudget, summary: viewSummary, history: viewHistory };
  const under = viewHeader() + viewSaveErrorBanner() + screens[state.route]() + viewTabbar();
  // one modal at a time, editor first — and inert walls the background off
  // from keyboard, pointer and AT: the platform's modality, no hand-rolled
  // focus trap. The editor rides above every screen, so a route change
  // mid-request cannot visually dismiss it.
  const sheet = state.editId ? viewEditSheet()
    : state.addOpen ? viewAddSheet(KIND_FOR_TAB[state.pickTab]) : '';
  // a confirm outranks both sheets and walls off even the one that asked it —
  // the question is the only live surface until it is answered
  if (state.confirm) {
    app.innerHTML = `<div inert>${under}${sheet}</div>${viewConfirmSheet()}`;
    return;
  }
  app.innerHTML = sheet ? `<div inert>${under}</div>${sheet}` : under;
}

/* ---------- surgical updates (keep focus while typing) ---------- */

function updateTotals() {
  const t = computeTotals(state.week);
  const totals = $('#totals');
  if (!totals) return;
  totals.dataset.tone = budgetTone(t);
  $('#total-num').textContent = fmtKsh(t.total);
  animateMoney($('#remaining-num'), t.remaining);
}

function animateMoney(el, to) {
  const from = el.dataset.val === '' ? null : Number(el.dataset.val);
  el.dataset.val = to ?? '';
  if (to == null || from == null || reducedMotion()) {
    el.textContent = fmtKsh(to);
    return;
  }
  const t0 = performance.now();
  const tick = (now) => {
    const p = Math.min((now - t0) / 350, 1);
    const eased = 1 - (1 - p) ** 3;
    el.textContent = fmtKsh(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = fmtKsh(to);
  };
  requestAnimationFrame(tick);
}

/* ================================================================
   9. ACTIONS & EVENTS
   ================================================================ */
// one meal write at a time, from either sheet or a Restore button: nothing
// dismisses, double-fires, or opens the editor over an airborne write
let mealWriteInFlight = false;

// the week delete has the same one-at-a-time shape, on its own gate
let weekDeleteInFlight = false;

// A timed-out write is abandoned, not cancelled — it may still land. Freeing
// the sheet would let a second write race it, so the app locks into a resync,
// which is the only thing that can tell what the server actually holds.
function lockOnUnknownWrite(err) {
  if (!err?.timedOut) return false;
  settleConfirm(false); // the error screen replaces any open question — answer it, don't strand its flow
  state.editId = null;
  state.editName = '';
  state.addOpen = false;
  state.addName = '';
  state.phase = 'error';
  state.errorTitle = "Can't confirm";
  state.errorMsg = "Couldn't tell whether that change landed — it took too long to answer. Tap Try again to read the truth from Supabase.";
  render();
  return true;
}

const actions = {
  'pick-tab': (el) => {
    state.pickTab = el.dataset.tab;
    render();
  },

  'toggle-pick': (el) => {
    const id = el.dataset.id;
    const list = state.week.picks[state.pickTab];
    const at = list.indexOf(id);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < PICK_TARGET) list.push(id);
    else {
      noticeSheet({
        title: `${PICK_TARGET} meals already selected`,
        body: 'Unpick one first to make room for this one.',
      });
      return;
    }
    state.week.days = reconcileDays(state.week.picks, state.week.days);
    scheduleSave();
    render();
  },

  'clear-picks': () => { clearPicks(state.pickTab); },

  'open-add': () => {
    state.addOpen = true;
    state.addName = '';
    state.errorMsg = '';
    render();
    $('#form-addmeal input[name="name"]')?.focus();
  },
  'close-add': () => {
    if (mealWriteInFlight) return; // no dismissing a sheet whose write is airborne
    state.addOpen = false; state.addName = ''; state.errorMsg = ''; render();
  },
  'close-edit': () => {
    if (mealWriteInFlight) return; // no dismissing a sheet whose request is airborne
    state.editId = null; state.editName = ''; state.errorMsg = ''; render();
  },

  // no render(): the typed password exists only in the DOM, so a repaint here
  // would erase what the user came to check
  'toggle-password': (el) => { togglePasswordField(el); },

  'confirm-yes': () => settleConfirm(true),
  'confirm-no': () => settleConfirm(false),

  'lift': (el) => {
    const { day, slot } = el.dataset;
    const lift = state.lifted;
    if (!lift || lift.slot !== slot) {
      state.lifted = { slot, day };
    } else if (lift.day === day) {
      state.lifted = null;
    } else {
      state.week.days = swapSlots(state.week.days, slot, lift.day, day);
      state.lifted = null;
      scheduleSave();
    }
    render();
  },

  'remove-item': (el) => {
    state.week.groceries = state.week.groceries.filter((g) => g.id !== el.dataset.row);
    scheduleSave();
    render();
  },

  'retry-sync': () => { resync(); },
  'retry-save': () => { flushSave(); },
  'reload': () => { location.reload(); },

  'save-week': async () => {
    if (saveWeekBusy()) return; // no confirm dialog over a running flow
    if (!(await confirmSheet({
      title: 'Save this week?',
      body: 'It moves to History and the next week starts fresh.',
      confirmLabel: 'Save week',
    }))) return;
    // gate the UI: an edit typed mid-flow would arm a debounced save that
    // fires into the just-frozen record
    state.phase = 'loading';
    state.loadingMsg = 'Saving the week…';
    render();
    const { outcome, error } = await performSaveWeek(currentMonday());
    // unreachable via this sole caller (the confirm's wall blocks a second
    // tap, and its answer resumes this flow in a microtask no click can beat)
    // — kept first so no future second caller can clobber the running flow's
    // gate or its caption
    if (outcome === 'busy') return;
    state.loadingMsg = '';
    if (outcome === 'save-unknown' || outcome === 'load-failed') {
      // editing must stop — Try again resyncs onto the truth either way
      state.phase = 'error';
      state.errorTitle = outcome === 'save-unknown' ? "Can't confirm" : "Can't load";
      state.errorMsg = outcome === 'save-unknown'
        ? "Couldn't confirm whether the week was saved. Tap Try again — the resync sorts it out either way."
        : 'The week was saved, but starting the next one failed. Tap Try again.';
      render();
      return;
    }
    state.phase = 'ready';
    if (outcome === 'done') {
      // hashchange can't be trusted (an equal hash fires no event), and
      // replaceState adds no history entry for a jump nobody navigated
      state.route = 'pick';
      state.historyDetail = null;
      history.replaceState(null, '', '#/pick');
      render();
      return;
    }
    render();
    if (outcome === 'dirty') {
      // fact only, no advice — remediation lives with the chip and banner
      noticeSheet({
        title: 'Not saved',
        body: "The week wasn't saved — your latest changes haven't reached Supabase yet.",
      });
    } else if (outcome === 'save-failed') {
      noticeSheet({
        title: 'Save failed',
        body: `Couldn't save the week: ${error?.message ?? 'refused'}. Nothing was changed — try again.`,
      });
    }
  },

  'archive-meal': async () => {
    const meal = mealById(state.editId);
    if (!meal || mealWriteInFlight) return;
    if (state.week.picks.mains.includes(meal.id) || state.week.picks.breakfasts.includes(meal.id)) {
      state.errorMsg = "It's on this week's menu — unpick it first, then archive.";
      render();
      return;
    }
    if (!(await confirmSheet({
      title: `Archive ${meal.name}?`,
      body: 'It leaves the picking grid but keeps its place in past weeks.',
      confirmLabel: 'Archive',
    }))) return;
    // no el.disabled here: the confirm's re-renders detached the tapped
    // button — the gate above is what blocks a re-dispatch
    mealWriteInFlight = true;
    try {
      const row = await withCeiling(db.updateMeal(meal.id, { archived: true }));
      Object.assign(meal, row);
      state.editId = null;
      state.editName = '';
      state.errorMsg = '';
    } catch (err) {
      if (lockOnUnknownWrite(err)) return;
      state.errorMsg = `Couldn't archive: ${err.message ?? 'no connection'}`;
    } finally {
      mealWriteInFlight = false;
    }
    render();
  },

  // shares the edit sheet's single flight: its Restore button routes here,
  // and an ungated restore would race a concurrent Save on the same meal
  'restore-meal': async (el) => {
    const meal = mealById(el.dataset.id);
    if (!meal || mealWriteInFlight) return;
    mealWriteInFlight = true;
    try {
      el.disabled = true; // dead while the request flies
      const row = await withCeiling(db.updateMeal(meal.id, { archived: false }));
      Object.assign(meal, row);
      state.errorMsg = ''; // a stale save failure must not outlive the restore that followed it
    } catch (err) {
      if (lockOnUnknownWrite(err)) return;
      el.disabled = false;
      // rides the confirm slot, so it reads the same from grid list and sheet alike
      noticeSheet({
        title: 'Restore failed',
        body: `Couldn't restore: ${err.message ?? 'no connection'}`,
      });
      return;
    } finally {
      mealWriteInFlight = false;
    }
    render();
  },

  'delete-week': async (el) => {
    const week = state.history?.find((w) => w.id === el.dataset.id);
    // a flag, not el.disabled — the confirm's re-renders detach the tapped
    // button, so disabling it would mutate a dead node
    if (!week || weekDeleteInFlight) return;
    if (!(await confirmSheet({
      title: `Delete the week of ${fmtDate(week.week_start)}?`,
      body: "There's no undo.",
      confirmLabel: 'Delete',
    }))) return;
    weekDeleteInFlight = true;
    try {
      // bounded like every other write: a hung delete must not hold the
      // gate forever with nothing on screen saying why
      await withCeiling(db.deleteWeek(week.id));
      state.history = state.history.filter((w) => w.id !== week.id);
      location.hash = '#/history'; // a different hash, so the change event repaints the list
    } catch (err) {
      if (lockOnUnknownWrite(err)) return; // deleteWeek is idempotent — the resync's re-read is safe
      noticeSheet({
        title: 'Delete failed',
        body: `Couldn't delete: ${err.message ?? 'no connection'}`,
      });
    } finally {
      weekDeleteInFlight = false;
    }
  },

  'retry-history': () => {
    state.historyError = '';
    render();
    loadHistory();
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (el) actions[el.dataset.action]?.(el);
});

// taking focus would drop the caret and, on a phone, close the keyboard
// mid-password — the toggle does its work without ever holding focus
document.addEventListener('mousedown', (e) => {
  if (isPasswordToggle(e.target)) e.preventDefault();
});

// Escape is the keyboard way out of a sheet — the in-flight guards still hold
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.confirm) settleConfirm(false); // the question is topmost — Escape answers it, not the sheet under it
  else if (state.editId) actions['close-edit']();
  else if (state.addOpen) actions['close-add']();
});

// error events don't bubble — capture phase is the only delegated way in
document.addEventListener('error', (e) => { markDeadImage(e.target); }, true);

/* ---------- long-press opens the meal editor ---------- */
const LONG_PRESS_MS = 500;
let press = null;          // { x, y, timer } while a hold is possible
let pressConsumed = false; // the hold fired — the trailing click is the same gesture

function openEditSheet(id) {
  const meal = mealById(id);
  if (!meal || mealWriteInFlight) return; // no opening the editor over an airborne meal request
  state.editId = id;
  state.editName = meal.name;
  state.addOpen = false;
  state.errorMsg = '';
  render();
  $('#form-editmeal input[name="name"]')?.focus();
}

function cancelPress() {
  if (!press) return;
  clearTimeout(press.timer);
  press = null;
}

document.addEventListener('pointerdown', (e) => {
  // primary only: a fresh gesture forgets a stale swallow, but a second
  // finger must not disarm the first finger's pending one
  if (e.isPrimary) pressConsumed = false;
  cancelPress(); // any new touch kills a pending hold — two fingers is not a hold
  if (e.button !== 0) return; // right-button holds belong to contextmenu
  const card = e.target.closest('.meal-card[data-id]');
  if (!card || state.editId) return;
  const id = card.dataset.id;
  press = {
    x: e.clientX, y: e.clientY,
    timer: setTimeout(() => { pressConsumed = true; openEditSheet(id); }, LONG_PRESS_MS),
  };
});
document.addEventListener('pointermove', (e) => {
  // fingers jitter in place — only a scroll-sized move breaks the hold
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) cancelPress();
});
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);

// Android long-press arrives as contextmenu and desktop right-click means the
// same thing; opening is idempotent, so the timer double-firing is harmless
document.addEventListener('contextmenu', (e) => {
  const card = e.target.closest('.meal-card[data-id]');
  if (!card) return;
  e.preventDefault();
  openEditSheet(card.dataset.id);
});

// capture phase: the click that ends a hold must die before the action
// delegate toggles the pick underneath the sheet
document.addEventListener('click', (e) => {
  if (!pressConsumed) return;
  pressConsumed = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.input === 'budget') {
    const v = parseMoney(el.value);
    if (v === undefined) return;
    state.week.budget = v;
    scheduleSave();
    updateTotals();
  }
  if (el.dataset.input === 'price') {
    const v = parseMoney(el.value);
    if (v === undefined) return;
    const row = state.week.groceries.find((g) => g.id === el.dataset.row);
    if (!row) return;
    row.price = v;
    scheduleSave();
    updateTotals();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;

  if (el.dataset.change === 'staple') {
    const staple = state.staples.find((s) => s.id === el.dataset.id);
    if (!staple) return;
    if (el.checked) {
      state.week.groceries.push({
        id: crypto.randomUUID(), stapleId: staple.id, name: staple.name,
        price: staple.last_price, checked: false,
      });
    } else {
      state.week.groceries = state.week.groceries.filter((g) => g.stapleId !== staple.id);
    }
    scheduleSave();
    render();
  }

  // change fires on blur/Enter with the committed text — typed words become
  // the day's lunch, an emptied field falls back to yesterday's pot
  if (el.dataset.change === 'lunch') {
    const day = state.week.days[el.dataset.day];
    if (!day) return;
    const text = el.value.trim();
    if (text) day.lunch = text;
    else delete day.lunch;
    scheduleSave();
  }

});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;

  if (form.id === 'form-signin') {
    // by type, not by position: the reveal toggle is the form's first button
    form.querySelector('button[type="submit"]').disabled = true;
    const ok = await signIn(form.email.value.trim(), form.password.value);
    if (ok) {
      state.phase = 'loading';
      render();
      initData(); // belt and braces with the SIGNED_IN event — initInFlight dedupes
    } else {
      render();
    }
  }

  if (form.id === 'form-addmeal') {
    const name = form.name.value.trim();
    if (!name || mealWriteInFlight) return;
    mealWriteInFlight = true;
    let image_url = null;
    try {
      form.querySelector('button[type="submit"]').disabled = true; // an upload takes a beat — no double adds
      const kind = KIND_FOR_TAB[state.pickTab];
      const tint = TINTS[state.meals.length % TINTS.length];
      const file = form.image.files[0];
      image_url = file ? await withCeiling(uploadPhoto(file)) : null;
      const meal = await withCeiling(db.addMeal(state.session.user.id, { name, kind, image_url, tint }));
      state.meals.push(meal);
      state.addOpen = false;
      state.addName = '';
      state.errorMsg = '';
    } catch (err) {
      // reclaim only on a server rejection (insert provably never landed);
      // a network unknown keeps the object — a live row may point at it
      if (image_url && isServerRejection(err)) {
        db.removeMealImage(image_url).catch((e) => console.warn('meal image orphaned:', image_url, e));
      } else if (image_url) {
        console.info('meal image kept, insert outcome unknown:', image_url);
      }
      if (lockOnUnknownWrite(err)) return;
      state.addName = name; // the file input can't be refilled, but the name can
      state.errorMsg = `Couldn't save: ${err.message ?? 'no connection'}`;
    } finally {
      mealWriteInFlight = false;
    }
    render();
  }

  if (form.id === 'form-editmeal') {
    const meal = mealById(state.editId);
    const name = form.name.value.trim();
    if (!meal || !name || mealWriteInFlight) return;
    mealWriteInFlight = true;
    let uploaded = null;
    try {
      form.querySelector('button[type="submit"]').disabled = true; // an upload takes a beat — no double saves
      const file = form.image.files[0];
      uploaded = file ? await withCeiling(uploadPhoto(file)) : null;
      const fields = uploaded ? { name, image_url: uploaded } : { name };
      const row = await withCeiling(db.updateMeal(meal.id, fields));
      if (uploaded) delete meal.imageDead; // a fresh URL deserves a fresh chance
      Object.assign(meal, row); // in place — picks and cards point at this object
      state.editId = null;
      state.editName = '';
      state.errorMsg = '';
    } catch (err) {
      // reclaim only the fresh upload, and only on a server rejection; the
      // replaced URL is never touched — seed meals share storage objects
      if (uploaded && isServerRejection(err)) {
        db.removeMealImage(uploaded).catch((e) => console.warn('meal image orphaned:', uploaded, e));
      } else if (uploaded) {
        console.info('meal image kept, update outcome unknown:', uploaded);
      }
      if (lockOnUnknownWrite(err)) return;
      state.editName = name;
      state.errorMsg = `Couldn't save: ${err.message ?? 'no connection'}`;
    } finally {
      mealWriteInFlight = false;
    }
    render();
  }

  if (form.id === 'form-additem') {
    const name = form.name.value.trim();
    if (!name) return;
    const price = parseMoney(form.price.value);
    state.week.groceries.push({
      id: crypto.randomUUID(), stapleId: null, name,
      price: price === undefined ? null : price, checked: false,
    });
    scheduleSave();
    render();
    $('#form-additem input[name="name"]')?.focus();
  }
});

/* ---------- routing lives in 3. UTILITIES; this is only the wiring ---------- */
window.addEventListener('hashchange', () => {
  settleConfirm(false); // back answers the question — an open one would strand the flow awaiting it
  const { route, detail } = currentRoute();
  state.route = route;
  state.historyDetail = detail;
  state.lifted = null;
  state.addOpen = false;
  // an airborne edit keeps its sheet: dismissing here would bypass the
  // single-flight guard and strand the failure message unseen
  if (!mealWriteInFlight) {
    state.editId = null;
    state.editName = '';
  }
  if (route === 'history') loadHistory();
  if (state.phase === 'ready') render();
});

window.addEventListener('online', () => {
  if (state.saveStatus === 'error') flushSave();
  if (reviveDeadImages() && state.phase === 'ready') render();
});

// flush on backgrounding, while the page is still alive to complete it —
// waiting for unload hands the browser a request it is free to kill
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && saveTimer) flushSave();
});

/* ================================================================
   10. BOOT
   ================================================================ */
let initInFlight = false;

async function initData() {
  // getSession() resolving and a SIGNED_IN event can both trigger init on the
  // same page load — running twice would double-seed the library.
  if (initInFlight) return;
  initInFlight = true;
  try {
    let { meals, staples } = await db.loadLibrary();
    if (meals.length === 0) meals = await db.seedMeals(state.session.user.id);
    if (staples.length === 0) staples = await db.seedStaples(state.session.user.id);
    const week = await db.loadActiveWeek(state.session.user.id, currentMonday());

    state.meals = meals;
    state.staples = staples;
    state.week = week;
    state.history = null;  // a resync must re-read past weeks too
    state.historyError = ''; // and not leave a stale failure painted over them
    state.saveStatus = 'saved';
    state.phase = 'ready';
    const { route, detail } = currentRoute();
    state.route = route;
    state.historyDetail = detail;
    if (route === 'history') loadHistory();
  } catch (err) {
    state.phase = 'error';
    state.errorTitle = "Can't load";
    state.errorMsg = err?.message
      ? `Something went wrong talking to Supabase: ${err.message}`
      : 'Could not reach Supabase — check your connection and try again.';
  } finally {
    initInFlight = false;
  }
  render();
}

async function resync() {
  // db.client is null when the CDN import itself failed — retrying the data
  // layer can never succeed then; re-run the boot path instead
  if (!db.client) return main();
  await initData();
}

// Saved weeks load lazily on the first History visit and stay cached until
// a save-week invalidates them (state.history = null).
let historyInFlight = false;
async function loadHistory() {
  if (historyInFlight || state.history) return;
  historyInFlight = true;
  try {
    state.history = await db.listSavedWeeks();
    state.historyError = '';
  } catch (err) {
    state.historyError = err?.message
      ? `Couldn't load past weeks: ${err.message}`
      : "Couldn't load past weeks — check your connection.";
  } finally {
    historyInFlight = false;
  }
  if (state.phase === 'ready') render();
}

async function boot(client) {
  db.client = client;

  client.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if (event === 'SIGNED_IN' && state.phase !== 'ready') initData();
    if (event === 'SIGNED_OUT') {
      settleConfirm(false); // signing out answers the question — one left open
                            // outlives the session and repaints over a new week
      state.phase = 'signin';
      render();
    }
  });

  const { data: { session } } = await client.auth.getSession();
  state.session = session;
  if (session) await initData();
  else if (state.phase === 'loading') {
    state.phase = 'signin';
    render();
  }
}

let bootInFlight = false;

async function main() {
  // repeated Retry taps must not stack CDN imports or auth listeners
  if (bootInFlight) return;
  bootInFlight = true;
  try {
    render(); // loading splash
    const configured = CONFIG.SUPABASE_URL.startsWith('https://') && !CONFIG.SUPABASE_ANON_KEY.startsWith('PASTE');
    if (!configured) {
      state.phase = 'config';
      render();
      return;
    }
    let createClient;
    try {
      ({ createClient } = await import(SUPABASE_CDN));
    } catch {
      state.phase = 'error';
      state.errorTitle = "Can't load";
      state.errorMsg = 'Could not load the app libraries — check your connection and try again.';
      render();
      return;
    }
    try {
      await boot(createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
        auth: { persistSession: true, detectSessionInUrl: true },
      }));
    } catch (err) {
      // a rejection out of boot() would otherwise park the app on the splash
      state.phase = 'error';
      state.errorTitle = "Can't start";
      state.errorMsg = err?.message
        ? `Could not start: ${err.message}`
        : 'Could not start — check your connection and try again.';
      render();
    }
  } finally {
    bootInFlight = false;
  }
}

// Debug/test seam: lets a fake client drive the app without touching Supabase.
window.__mealshop = { state, boot, render, db };

main();
</script>
