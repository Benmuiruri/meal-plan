<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1B5B9E">
<meta name="color-scheme" content="light">
<title>Meal &amp; Shop</title>

<style>
/* ================================================================
   1. DESIGN TOKENS — hand-painted hoteli menu board
   ================================================================ */
:root {
  --blue:    #1B5B9E;
  --mustard: #F2B21B;
  --tomato:  #E23E2C;
  --leaf:    #2E7D46;
  --chalk:   #FBF6EA;
  --ink:     #17140F;

  --chalk-dim: rgba(251, 246, 234, 0.62);
  --ink-dim:   rgba(23, 20, 15, 0.55);
  --line:      rgba(23, 20, 15, 0.14);

  --display: 'Anton', sans-serif;
  --body:    'Work Sans', sans-serif;
  --mono:    'DM Mono', monospace;

  --radius: 12px;
  --tabbar-h: calc(58px + env(safe-area-inset-bottom));
}

/* ================================================================
   2. BASE
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body);
  background: var(--chalk);
  color: var(--ink);
  min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.money { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.screen {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--tabbar-h) + 96px);
}

h2.screen-title {
  font-family: var(--display);
  font-size: 26px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 6px 0 14px;
}

/* ================================================================
   3. HEADER, STATUS DOT, BANNERS, TAB BAR
   ================================================================ */
.header {
  position: sticky; top: 0; z-index: 30;
  background: var(--blue); color: var(--chalk);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px calc(10px);
  padding-top: calc(12px + env(safe-area-inset-top));
  box-shadow: 0 2px 0 rgba(23,20,15,0.25);
}
.header .brand {
  font-family: var(--display);
  font-size: 20px; letter-spacing: 0.06em;
}
.brand .amp { color: var(--mustard); }
.save-state { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--chalk-dim); }
.save-state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
.save-state[data-status="saving"] .dot { background: var(--mustard); }
.save-state[data-status="error"]  .dot { background: var(--tomato); }

.banner {
  background: var(--tomato); color: var(--chalk);
  padding: 10px 16px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
.banner button {
  background: var(--chalk); color: var(--tomato);
  font-weight: 700; font-size: 13px;
  padding: 6px 12px; border-radius: 8px; flex-shrink: 0;
}

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--chalk);
  border-top: 2px solid var(--ink);
  display: flex;
  height: var(--tabbar-h);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-dim);
}
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.is-active { color: var(--tomato); }

/* ================================================================
   4. STANDALONE CARDS (sign in, config, errors)
   ================================================================ */
.gate {
  min-height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
  background: var(--blue);
}
.gate .board-title {
  font-family: var(--display); color: var(--chalk);
  font-size: 44px; letter-spacing: 0.04em; text-transform: uppercase;
  text-align: center; line-height: 1.05;
}
.gate .board-title .amp { color: var(--mustard); }
.gate .tagline { color: var(--chalk-dim); margin: 10px 0 28px; font-size: 15px; text-align: center; }
.gate-card {
  background: var(--chalk); border-radius: var(--radius);
  padding: 22px; width: 100%; max-width: 400px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.25);
}
.gate-card h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
.gate-card p { font-size: 14px; line-height: 1.5; color: var(--ink-dim); margin-bottom: 12px; }
.gate-card ol { font-size: 14px; line-height: 1.6; padding-left: 20px; }
.gate-card ol li { margin-bottom: 8px; }
.gate-card code { font-family: var(--mono); font-size: 13px; background: rgba(23,20,15,0.07); padding: 1px 5px; border-radius: 4px; }
.gate-card .error { color: var(--tomato); font-weight: 600; font-size: 13px; margin-top: 10px; }

.field {
  width: 100%; padding: 12px 14px; margin-bottom: 12px;
  border: 2px solid var(--ink); border-radius: 10px;
  background: #fff; font-size: 16px;
}
.field:focus { outline: 3px solid var(--mustard); outline-offset: 1px; }
.btn-primary {
  width: 100%; padding: 13px;
  background: var(--tomato); color: var(--chalk);
  font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
  border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.3);
}
.btn-primary:active { transform: translateY(2px); box-shadow: none; }
.btn-primary:disabled { opacity: 0.55; }

/* ================================================================
   5. PICK
   ================================================================ */
.pick-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
.pick-toggle button {
  flex: 1; padding: 10px;
  font-family: var(--display); font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase;
  border: 2px solid var(--ink); border-radius: 10px; color: var(--ink-dim);
}
.pick-toggle button.is-active { background: var(--ink); color: var(--chalk); }

.pick-count {
  position: sticky; top: 55px; z-index: 20;
  background: var(--chalk);
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 2px; border-bottom: 2px solid var(--ink);
  margin-bottom: 14px;
}
.pick-count .label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
.pick-count .count { font-family: var(--mono); font-size: 20px; font-weight: 500; }
.pick-count.bump .count { color: var(--tomato); }

.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meal-card {
  position: relative; aspect-ratio: 1;
  border-radius: var(--radius); overflow: hidden;
  border: 3px solid transparent;
  box-shadow: 0 2px 0 rgba(23,20,15,0.2);
  text-align: left; width: 100%;
  display: flex; align-items: flex-end;
  padding: 10px;
}
.meal-card .name {
  font-family: var(--display); color: var(--chalk);
  font-size: 17px; line-height: 1.15; letter-spacing: 0.03em; text-transform: uppercase;
  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  position: relative; z-index: 1;
}
.meal-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.meal-card .shade { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,0.55)); }
.meal-card.is-picked { border-color: var(--ink); }
.meal-card .badge {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--mustard); color: var(--ink);
  display: none; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.3);
}
.meal-card.is-picked .badge { display: flex; }

.add-card {
  aspect-ratio: 1; border-radius: var(--radius);
  border: 3px dashed var(--ink-dim); color: var(--ink-dim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 14px; width: 100%;
}
.add-card .plus { font-size: 34px; line-height: 1; font-family: var(--display); }

.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(23,20,15,0.5); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  background: var(--chalk); border-radius: 16px 16px 0 0;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto;
}
.sheet h3 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 14px; }
.sheet .row-btns { display: flex; gap: 10px; margin-top: 4px; }
.sheet .row-btns .btn-primary { flex: 2; width: auto; }
.btn-quiet {
  flex: 1; padding: 13px; border-radius: 10px;
  border: 2px solid var(--ink); font-weight: 700; font-size: 15px;
}

/* ================================================================
   6. WEEK — the painted board
   ================================================================ */
.board {
  background: var(--blue); border-radius: 14px;
  padding: 18px 16px 8px;
  box-shadow: 0 5px 0 rgba(23,20,15,0.35);
  color: var(--chalk);
}
.board-head {
  font-family: var(--display); color: var(--mustard);
  text-transform: uppercase; letter-spacing: 0.08em; font-size: 14px;
  text-align: center; padding-bottom: 12px;
  border-bottom: 2px solid rgba(251,246,234,0.35);
}
.board-day { padding: 13px 0 12px; border-bottom: 1px dashed rgba(251,246,234,0.3); }
.board-day:last-child { border-bottom: none; }
.board-day .day-name {
  font-family: var(--display); color: var(--mustard);
  font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.slot {
  display: flex; align-items: baseline; gap: 10px;
  width: 100%; text-align: left; padding: 4px 6px; margin: 0 -6px;
  border-radius: 8px; border: 2px solid transparent;
}
.slot .tag {
  flex-shrink: 0; width: 74px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--chalk-dim);
}
.slot .meal { font-size: 15px; font-weight: 500; }
.slot--dinner .meal { font-size: 17px; font-weight: 700; }
.slot--dinner .tag { color: var(--mustard); }
.slot--lunch { color: var(--chalk-dim); }
.slot--lunch .meal { font-size: 13px; font-style: italic; font-weight: 400; }
button.slot:active { background: rgba(251,246,234,0.12); }
.slot.is-lifted {
  border-color: var(--mustard); background: rgba(242,178,27,0.14);
  transform: translateY(-3px);
  transition: transform 0.15s ease;
}
.swap-hint {
  position: sticky; bottom: calc(var(--tabbar-h) + 8px); z-index: 25;
  margin-top: 14px;
  background: var(--mustard); color: var(--ink);
  font-size: 13px; font-weight: 600;
  padding: 10px 14px; border-radius: 10px;
  box-shadow: 0 3px 0 rgba(23,20,15,0.3);
}
.week-locked {
  background: var(--blue); color: var(--chalk); border-radius: 14px;
  padding: 40px 24px; text-align: center;
  box-shadow: 0 5px 0 rgba(23,20,15,0.35);
}
.week-locked .big { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.3; margin-bottom: 12px; }
.week-locked .counts { font-family: var(--mono); color: var(--mustard); font-size: 15px; }

/* ================================================================
   7. BUDGET
   ================================================================ */
.budget-head { margin-bottom: 18px; }
.budget-head label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin-bottom: 6px; }
.budget-amount { display: flex; align-items: center; gap: 8px; }
.budget-amount .cur { font-family: var(--mono); font-size: 20px; color: var(--ink-dim); }
.budget-amount input {
  width: 100%; padding: 10px 12px; font-family: var(--mono); font-size: 24px;
  border: 2px solid var(--ink); border-radius: 10px; background: #fff;
}

.list-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin: 18px 0 8px; }
.g-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px; border-bottom: 1px solid var(--line);
}
.g-row .g-name { flex: 1; font-weight: 500; font-size: 15px; }
.g-row .g-unit { font-size: 12px; color: var(--ink-dim); margin-left: 6px; font-weight: 400; }
.g-row input.g-price {
  width: 84px; text-align: right;
  font-family: var(--mono); font-size: 15px;
  padding: 7px 8px; border: 2px solid var(--line); border-radius: 8px; background: #fff;
}
.g-row input.g-price:focus { border-color: var(--ink); outline: none; }
.g-row input.g-price:disabled { background: transparent; border-color: transparent; }

.tick { position: relative; width: 26px; height: 26px; flex-shrink: 0; }
.tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.tick .box {
  position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 7px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: transparent; font-weight: 700; font-size: 15px;
  pointer-events: none;
}
.tick input:checked + .box { background: var(--leaf); border-color: var(--leaf); color: var(--chalk); }
.tick input:focus-visible + .box { outline: 3px solid var(--mustard); }
.tick input:disabled + .box { opacity: 0.45; }

.g-remove { color: var(--tomato); font-size: 20px; font-weight: 700; width: 26px; flex-shrink: 0; text-align: center; }

.add-item { display: flex; gap: 8px; margin-top: 12px; }
.add-item input { padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font-size: 15px; min-width: 0; }
.add-item input[name="name"] { flex: 1; }
.add-item input[name="price"] { width: 92px; font-family: var(--mono); text-align: right; }
.add-item button {
  background: var(--ink); color: var(--chalk); font-weight: 700;
  padding: 0 16px; border-radius: 10px; flex-shrink: 0;
}
.add-item button:disabled { opacity: 0.4; }

.fruits-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 16px; padding: 12px;
  background: rgba(46,125,70,0.1); border: 2px dashed var(--leaf); border-radius: 10px;
}
.fruits-row .g-name { flex: 1; font-weight: 600; color: var(--leaf); }
.fruits-row .money { color: var(--leaf); font-weight: 500; }

.totals {
  position: fixed; left: 0; right: 0; bottom: var(--tabbar-h); z-index: 29;
  background: var(--ink); color: var(--chalk);
  padding: 12px 16px;
}
.totals-inner { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.totals .t-block { text-align: right; }
.totals .t-block:first-child { text-align: left; }
.totals .t-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(251,246,234,0.55); }
.totals .t-num { font-family: var(--mono); font-size: 18px; }
.totals .t-num.t-big { font-size: 28px; font-weight: 500; line-height: 1.1; }
.totals[data-tone="green"] .t-big { color: #7fd89a; }
.totals[data-tone="amber"] .t-big { color: var(--mustard); }
.totals[data-tone="red"]   .t-big { color: #ff8d7e; }

/* ================================================================
   8. SUMMARY
   ================================================================ */
.sum-board { margin-bottom: 20px; }
.sum-day { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(251,246,234,0.3); font-size: 13px; }
.sum-day:last-child { border-bottom: none; }
.sum-day .d { font-family: var(--display); color: var(--mustard); width: 46px; flex-shrink: 0; letter-spacing: 0.08em; font-size: 13px; padding-top: 1px; }
.sum-day .meals-col { flex: 1; min-width: 0; }
.sum-day .m-line { display: flex; gap: 6px; }
.sum-day .m-line .k { color: var(--chalk-dim); width: 14px; flex-shrink: 0; font-weight: 700; }
.sum-day .m-line.lunch { color: var(--chalk-dim); font-style: italic; }

.shop-row { padding: 4px; }
.shop-row .g-name { transition: opacity 0.15s; }
.shop-row.is-checked .g-name { text-decoration: line-through; opacity: 0.45; }
.shop-row.is-checked .money { opacity: 0.45; }
.empty-note { color: var(--ink-dim); font-size: 14px; padding: 16px 4px; line-height: 1.5; }

/* ================================================================
   9. MOTION
   ================================================================ */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

/* ================================================================
   2. CONSTANTS & SEED DATA
   ================================================================ */
const DAY_KEYS  = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_NAMES = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };
const TINTS = ['#1B5B9E', '#E23E2C', '#2E7D46', '#F2B21B'];
const PICK_TARGET = 7;

const SEED_MAINS = [
  'Chapo + chicken stew', 'Rice biriani', 'Chapo + maini stew', 'Fish fillet',
  'Meat balls', 'Tumbukiza + chapo', 'Steak', 'Pasta salad', 'Potato salad',
  'Noodles', 'Matoke', 'Cheesy hot dogs',
];
const SEED_BREAKFASTS = [
  'Weetabix', 'Nwaci + egg + avocado', 'Oats', 'Uji + peanuts', 'Boiled maize + egg',
  'Liver + vegetables', 'Mandizi + vegetables', 'Mushroom + scrambled', 'Bone soup + buns',
  'Pumpkin soup + buns', 'Butter soup + buns', 'Smoothie + cake', 'Grape salad',
  'Cornflakes + egg', 'Mbaazi + mahamri',
];

  { name: 'Eggs',         price: 100 },
  { name: 'Beans',        unit: '1kg' },
  { name: 'Carrots' },
  { name: 'Spinach' },

  { name: 'Pork',         price: 350 },
  { name: 'Beef',         price: 200 },
];

/* ================================================================
   3. UTILITIES
   ================================================================ */
const $ = (sel) => document.querySelector(sel);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const fmtNum = (n) => n == null ? '—'
  : Number(n).toLocaleString('en-KE', { maximumFractionDigits: 2 });
const fmtKsh = (n) => n == null ? '—' : `KSh ${fmtNum(n)}`;

// '' → null (cleared); invalid or negative → undefined (rejected, keep old value)
function parseMoney(raw) {
  const s = String(raw).trim();
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : undefined;
}

function currentMonday() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================================================================
   4. DOMAIN — pure functions, no DOM, no network
   ================================================================ */
function picksComplete(week) {
  return week.picks.mains.length === PICK_TARGET
      && week.picks.breakfasts.length === PICK_TARGET;
}

// Keep day assignments consistent with picks: drop meals no longer picked,
// deduplicate, then fill empty days from picks in order.
function reconcileDays(picks, days) {
  const out = {};
  for (const k of DAY_KEYS) {
    out[k] = { breakfast: days?.[k]?.breakfast ?? null, dinner: days?.[k]?.dinner ?? null };
  }
  const slots = [['breakfast', picks.breakfasts], ['dinner', picks.mains]];
  for (const [slot, list] of slots) {
    const valid = new Set(list);
    const used = new Set();
    for (const k of DAY_KEYS) {
      const id = out[k][slot];
      if (id && (!valid.has(id) || used.has(id))) out[k][slot] = null;
      if (out[k][slot]) used.add(out[k][slot]);
    }
    const queue = list.filter((id) => !used.has(id));
    for (const k of DAY_KEYS) {
      if (!out[k][slot] && queue.length) out[k][slot] = queue.shift();
    }
  }
  return out;
}

function swapSlots(days, slot, dayA, dayB) {
  const out = structuredClone(days);
  [out[dayA][slot], out[dayB][slot]] = [out[dayB][slot], out[dayA][slot]];
  return out;
}

// Lunch is never stored: it is always the previous day's dinner. Monday has none.
function lunchFor(days, dayKey) {
  const i = DAY_KEYS.indexOf(dayKey);
  return i <= 0 ? null : days[DAY_KEYS[i - 1]]?.dinner ?? null;
}

function computeTotals(week) {
  const total = Math.round(week.groceries.reduce((sum, g) => sum + (g.price ?? 0), 0) * 100) / 100;
  const budget = week.budget;
  const remaining = budget == null ? null : Math.round((budget - total) * 100) / 100;
  return { total, budget, remaining };
}

function budgetTone({ budget, remaining }) {
  if (remaining == null) return 'plain';
  if (remaining < 0) return 'red';
  if (budget > 0 && remaining < budget * 0.1) return 'amber';
  return 'green';
}

// The fruits line is display-only and never part of the total —
// otherwise enabling it would pin "remaining" to zero.
const fruitsAmount = (totals) =>
  totals.remaining == null ? null : Math.max(totals.remaining, 0);

/* ================================================================
   5. DATA LAYER — every Supabase call lives here
   ================================================================ */
const db = {
  client: null,

  async loadLibrary() {
    const [meals, staples] = await Promise.all([
      this.client.from('meals').select('*').eq('archived', false).order('created_at'),
      this.client.from('staples').select('*').order('sort_order'),
    ]);
    if (meals.error) throw meals.error;
    if (staples.error) throw staples.error;
    return { meals: meals.data, staples: staples.data };
  },

  async seedMeals(userId) {
    const rows = [
      ...SEED_MAINS.map((name, i) => ({ user_id: userId, name, kind: 'main', tint: TINTS[i % TINTS.length] })),
      ...SEED_BREAKFASTS.map((name, i) => ({ user_id: userId, name, kind: 'breakfast', tint: TINTS[(i + 2) % TINTS.length] })),
    ];
    const { data, error } = await this.client.from('meals').insert(rows).select();
    if (error) throw error;
    return data;
  },

  async seedStaples(userId) {
    const rows = SEED_STAPLES.map((s, i) => ({
      user_id: userId, name: s.name, unit: s.unit ?? null, last_price: s.price ?? null, sort_order: i,
    }));
    const { data, error } = await this.client.from('staples').insert(rows).select();
    if (error) throw error;
    return data;
  },

  async ensureWeek(userId, weekStart) {
    const found = await this.client.from('weeks').select('*')
      .eq('week_start', weekStart).maybeSingle();
    if (found.error) throw found.error;
    if (found.data) return found.data;
    const created = await this.client.from('weeks')
      .insert({ user_id: userId, week_start: weekStart }).select().single();
    if (created.error) throw created.error;
    return created.data;
  },

  async saveWeek(week) {
    const payload = {
      budget: week.budget,
      picks: week.picks,
      days: week.days,
      groceries: week.groceries,
      use_remainder: week.use_remainder,
    };
    const { data, error } = await this.client.from('weeks')
      .update(payload).eq('id', week.id).select('id');
    if (error) throw error;
    if (data && data.length > 0) return;
    // An update matching zero rows reports no error, but the row is gone
    // (deleted elsewhere, reset project) — restore it rather than letting
    // every retry fail forever. Conflict on the natural key, not the id:
    // another device may have already recreated this week under a fresh id,
    // and inserting a second (user_id, week_start) row would 23505 forever.
    if (!week.user_id || !week.week_start || !week.status) {
      // a local, permanent condition — retrying can never fix it, so it must
      // not be dressed up as a connection problem
      const incomplete = new Error('week row incomplete — cannot restore');
      incomplete.permanent = true;
      throw incomplete;
    }
    const { data: restored, error: restoreError } = await this.client.from('weeks')
      .upsert({
        user_id: week.user_id,
        week_start: week.week_start,
        status: week.status,
        ...payload,
      }, { onConflict: 'user_id,week_start' })
      .select('id').single();
    if (restoreError) throw restoreError;
    week.id = restored.id; // adopt the canonical row, whoever created it
  },

  async addMeal(userId, { name, kind, image_url, tint }) {
    const { data, error } = await this.client.from('meals')
      .insert({ user_id: userId, name, kind, image_url, tint }).select().single();
    if (error) throw error;
    return data;
  },
};

// "JWT issued at future": a freshly minted access token can look post-dated
// to a Supabase node whose clock runs a beat behind the issuer's. Its code,
// PGRST303, covers every JWT claims failure — expired tokens included — so
// the message is the discriminator, not decoration. The rejected request
// never executed, but earlier requests inside a multi-step method did, so
// the retry re-running the whole method is safe only while every db method
// stays idempotent (reads, same-payload updates, natural-key upserts) —
// new methods must keep that property or opt out of the wrap below.
const SKEW_RETRY_MS = 2000;
async function withSkewRetry(run) {
  try {
    return await run();
  } catch (err) {
    const skewRejected = err?.code === 'PGRST303' && /issued at future/i.test(err?.message ?? '');
    if (!skewRejected) throw err;
    await new Promise((resolve) => setTimeout(resolve, SKEW_RETRY_MS));
    return run();
  }
}
for (const [name, method] of Object.entries(db)) {
  if (typeof method !== 'function') continue;
  db[name] = function (...args) { return withSkewRetry(() => method.apply(this, args)); };
}

// Sign in with the shared household credentials. Pure state transition —
// rendering and data loading stay with the caller.
async function signIn(email, password) {
  const { data, error } = await db.client.auth.signInWithPassword({ email, password });
  if (error) {
    state.signinEmail = email; // survive the re-render; only the password needs retyping
    // key on the stable error code, with the message as a fallback for older responses
    state.errorMsg = (error.code === 'invalid_credentials' || error.message === 'Invalid login credentials')
      ? 'Wrong email or password.'
      : error.message;
    return false;
  }
  state.errorMsg = '';
  state.signinEmail = ''; // never pre-fill a future sign-in with a failed address
  state.session = data.session;
  return true;
}

/* ================================================================
   7. SAVE PIPELINE — debounced 800ms, loud on failure
   ================================================================ */
let saveTimer = null;
let saveInFlight = false;

function scheduleSave() {
  setSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 800);
}

async function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!state.week) return;
  // Saves are strictly serialized: firing a second request while one is in
  // flight lets the requests land out of order server-side, and lets the
  // first completion stamp "Saved" while newer edits are still airborne.
  if (saveInFlight) {
    saveTimer = setTimeout(flushSave, 200);
    return;
  }
  saveInFlight = true;
  try {
    await db.saveWeek(state.week);
    if (!saveTimer) setSaveStatus('saved');
  } catch (err) {
    // no silent failure: keep the edits in memory and surface the banner —
    // transient failures offer Retry, permanent ones an honest Reload
    state.saveErrorPermanent = !!err?.permanent;
    setSaveStatus('error');
  } finally {
    saveInFlight = false;
    // if edits queued behind this request while the tab went hidden, don't
    // trust a throttled background timer — send them now, while the page is
    // still alive to complete the request
    if (saveTimer && document.visibilityState === 'hidden') flushSave();
  }
}

// Surgical, state-driven banner management: a full render() here would
// rebuild the inputs and yank focus mid-typing on the flaky-connection path.
// Rebuilt only when the failure class changes — an escalation must replace
// the stale Retry banner, but a repeat of the same failure keeps the element
// (and the focus of whoever just pressed its Retry button) intact.
function updateSaveBanner() {
  const existing = $('#save-banner');
  const show = state.phase === 'ready' && state.saveStatus === 'error';
  const kind = state.saveErrorPermanent ? 'permanent' : 'transient';
  if (show && existing?.dataset.kind === kind) return;
  existing?.remove();
  if (show) $('.header')?.insertAdjacentHTML('afterend', viewSaveErrorBanner());
}

function setSaveStatus(status) {
  state.saveStatus = status;
  updateSaveBanner(); // banner visibility tracks every transition, so a
                      // resumed edit clears "Couldn't save" immediately
  const el = $('#save-state');
  if (el) {
    el.dataset.status = status;
    el.querySelector('.label').textContent =
      status === 'saving' ? 'Saving' : status === 'error' ? 'Not saved' : 'Saved';
  }
}

function render() {
  const app = $('#app');
  switch (state.phase) {
    case 'loading':     app.innerHTML = viewGate('<p>Loading…</p>'); return;
    case 'config':      app.innerHTML = viewConfig(); return;
    case 'signin':      app.innerHTML = viewSignin(); return;
    case 'error':       app.innerHTML = viewError(); return;
  }
  const screens = { pick: viewPick, week: viewWeek, budget: viewBudget, summary: viewSummary };
  app.innerHTML = viewHeader() + viewSaveErrorBanner() + screens[state.route]() + viewTabbar();
}

/* ---------- surgical updates (keep focus while typing) ---------- */

function updateTotals() {
  const t = computeTotals(state.week);
  const totals = $('#totals');
  if (!totals) return;
  totals.dataset.tone = budgetTone(t);
  $('#total-num').textContent = fmtKsh(t.total);
  animateMoney($('#remaining-num'), t.remaining);
  const fruits = $('#fruits-amount');
  if (fruits) fruits.textContent = viewFruitsAmount();
}

function animateMoney(el, to) {
  const from = el.dataset.val === '' ? null : Number(el.dataset.val);
  el.dataset.val = to ?? '';
  if (to == null || from == null || reducedMotion()) {
    el.textContent = fmtKsh(to);
    return;
  }
  const t0 = performance.now();
  const tick = (now) => {
    const p = Math.min((now - t0) / 350, 1);
    const eased = 1 - (1 - p) ** 3;
    el.textContent = fmtKsh(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = fmtKsh(to);
  };
  requestAnimationFrame(tick);
}

/* ================================================================
   9. ACTIONS & EVENTS
   ================================================================ */
const actions = {
  'pick-tab': (el) => {
    state.pickTab = el.dataset.tab;
    render();
  },

  'toggle-pick': (el) => {
    const id = el.dataset.id;
    const list = state.week.picks[state.pickTab];
    const at = list.indexOf(id);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < PICK_TARGET) list.push(id);
    else {
      const count = $('#pick-count');
      count.classList.add('bump');
      setTimeout(() => count.classList.remove('bump'), 600);
      return;
    }
    state.week.days = reconcileDays(state.week.picks, state.week.days);
    scheduleSave();
    render();
  },

  'open-add': () => {
    state.addOpen = true;
    state.errorMsg = '';
    render();
    $('#form-addmeal input[name="name"]')?.focus();
  },
  'close-add': () => { state.addOpen = false; state.errorMsg = ''; render(); },

  'lift': (el) => {
    const { day, slot } = el.dataset;
    const lift = state.lifted;
    if (!lift || lift.slot !== slot) {
      state.lifted = { slot, day };
    } else if (lift.day === day) {
      state.lifted = null;
    } else {
      state.week.days = swapSlots(state.week.days, slot, lift.day, day);
      state.lifted = null;
      scheduleSave();
    }
    render();
  },

  'remove-item': (el) => {
    state.week.groceries = state.week.groceries.filter((g) => g.id !== el.dataset.row);
    scheduleSave();
    render();
  },

  'retry-sync': () => { resync(); },
  'retry-save': () => { flushSave(); },
  'reload': () => { location.reload(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (el) actions[el.dataset.action]?.(el);
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.input === 'budget') {
    const v = parseMoney(el.value);
    if (v === undefined) return;
    state.week.budget = v;
    scheduleSave();
    updateTotals();
  }
  if (el.dataset.input === 'price') {
    const v = parseMoney(el.value);
    if (v === undefined) return;
    const row = state.week.groceries.find((g) => g.id === el.dataset.row);
    if (!row) return;
    row.price = v;
    scheduleSave();
    updateTotals();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;

  if (el.dataset.change === 'staple') {
    const staple = state.staples.find((s) => s.id === el.dataset.id);
    if (!staple) return;
    if (el.checked) {
      state.week.groceries.push({
        id: crypto.randomUUID(), stapleId: staple.id, name: staple.name,
        unit: staple.unit, price: staple.last_price, checked: false,
      });
    } else {
      state.week.groceries = state.week.groceries.filter((g) => g.stapleId !== staple.id);
    }
    scheduleSave();
    render();
  }

  if (el.dataset.change === 'fruits') {
    state.week.use_remainder = el.checked;
    scheduleSave();
    render();
  }

  if (el.dataset.change === 'tick') {
    const row = state.week.groceries.find((g) => g.id === el.dataset.row);
    if (!row) return;
    row.checked = el.checked;
    scheduleSave();
    $('#shop-' + row.id)?.classList.toggle('is-checked', el.checked);
  }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;

  if (form.id === 'form-signin') {
    form.querySelector('button').disabled = true;
    const ok = await signIn(form.email.value.trim(), form.password.value);
    if (ok) {
      state.phase = 'loading';
      render();
      initData(); // belt and braces with the SIGNED_IN event — initInFlight dedupes
    } else {
      render();
    }
  }

  if (form.id === 'form-addmeal') {
    const name = form.name.value.trim();
    if (!name) return;
    const kind = state.pickTab === 'mains' ? 'main' : 'breakfast';
    const tint = TINTS[state.meals.length % TINTS.length];
    const image_url = form.image_url.value.trim() || null;
    try {
      const meal = await db.addMeal(state.session.user.id, { name, kind, image_url, tint });
      state.meals.push(meal);
      state.addOpen = false;
      state.errorMsg = '';
    } catch (err) {
      state.errorMsg = `Couldn't save: ${err.message ?? 'no connection'}`;
    }
    render();
  }

  if (form.id === 'form-additem') {
    const name = form.name.value.trim();
    if (!name) return;
    const price = parseMoney(form.price.value);
    state.week.groceries.push({
      id: crypto.randomUUID(), stapleId: null, name,
      unit: null, price: price === undefined ? null : price, checked: false,
    });
    scheduleSave();
    render();
    $('#form-additem input[name="name"]')?.focus();
  }
});

/* ---------- routing — hash-based so the phone's back button behaves ---------- */
const ROUTES = ['pick', 'week', 'budget', 'summary'];

function currentRoute() {
  const m = location.hash.match(/^#\/(\w+)/);
  return ROUTES.includes(m?.[1]) ? m[1] : 'pick';
}

window.addEventListener('hashchange', () => {
  state.route = currentRoute();
  state.lifted = null;
  state.addOpen = false;
  if (state.phase === 'ready') render();
});

window.addEventListener('online', () => { if (state.saveStatus === 'error') flushSave(); });

// Flush a pending debounce as soon as the tab is backgrounded — the page is
// still alive then, so the request usually completes; waiting for unload
// would hand the browser a request it is free to kill.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && saveTimer) flushSave();
});

/* ================================================================
   10. BOOT
   ================================================================ */
let initInFlight = false;

async function initData() {
  // getSession() resolving and a SIGNED_IN event can both trigger init on the
  // same page load — running twice would double-seed the library.
  if (initInFlight) return;
  initInFlight = true;
  try {
    let { meals, staples } = await db.loadLibrary();
    if (meals.length === 0) meals = await db.seedMeals(state.session.user.id);
    if (staples.length === 0) staples = await db.seedStaples(state.session.user.id);
    const week = await db.ensureWeek(state.session.user.id, currentMonday());

    state.meals = meals;
    state.staples = staples;
    state.week = week;
    state.saveStatus = 'saved';
    state.phase = 'ready';
    state.route = currentRoute();
  } catch (err) {
    state.phase = 'error';
    state.errorMsg = err?.message
      ? `Something went wrong talking to Supabase: ${err.message}`
      : 'Could not reach Supabase — check your connection and try again.';
  } finally {
    initInFlight = false;
  }
  render();
}

async function resync() {
  // db.client is null when the CDN import itself failed — retrying the data
  // layer can never succeed then; re-run the boot path instead
  if (!db.client) return main();
  await initData();
}

async function boot(client) {
  db.client = client;

  client.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if (event === 'SIGNED_IN' && state.phase !== 'ready') initData();
    if (event === 'SIGNED_OUT') {
      state.phase = 'signin';
      render();
    }
  });

  const { data: { session } } = await client.auth.getSession();
  state.session = session;
  if (session) await initData();
  else if (state.phase === 'loading') {
    state.phase = 'signin';
    render();
  }
}

let bootInFlight = false;

async function main() {
  // repeated Retry taps (or Retry racing an 'online' event) must not stack
  // CDN imports, clients, or duplicate auth listeners
  if (bootInFlight) return;
  bootInFlight = true;
  try {
    render(); // loading splash
    const configured = CONFIG.SUPABASE_URL.startsWith('https://') && !CONFIG.SUPABASE_ANON_KEY.startsWith('PASTE');
    if (!configured) {
      state.phase = 'config';
      render();
      return;
    }
    let createClient;
    try {
      ({ createClient } = await import(SUPABASE_CDN));
    } catch {
      state.phase = 'error';
      state.errorMsg = 'Could not load the app libraries — check your connection and try again.';
      render();
      return;
    }
    try {
      await boot(createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
        auth: { persistSession: true, detectSessionInUrl: true },
      }));
    } catch (err) {
      // without this, a rejection out of boot() parks the app on the loading
      // splash with no error surface and no retry
      state.phase = 'error';
      state.errorMsg = err?.message
        ? `Could not start: ${err.message}`
        : 'Could not start — check your connection and try again.';
      render();
    }
  } finally {
    bootInFlight = false;
  }
}

// Debug/test seam: lets a fake client drive the app without touching Supabase.
window.__mealshop = { state, boot, render, db };

main();
</script>
